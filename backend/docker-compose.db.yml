version: '3.8'

services:
  postgres-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: studio-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: studiodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
